<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZM SOCIAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;color:#171717;font-family:Arial,sans-serif}
header{height:65px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:800;color:#1877f2}
header input{padding:10px;border:1px solid #ddd;border-radius:9px;background:#f5f5f5}
main{max-width:650px;margin:25px auto;padding:0 12px}
.stories{display:flex;gap:17px;overflow:auto;background:white;padding:18px;border:1px solid #eee;border-radius:12px}
.story{text-align:center;min-width:60px;font-size:12px}
.circle{width:55px;height:55px;border-radius:50%;border:3px solid #1877f2;display:grid;place-items:center;font-size:22px;margin:auto auto 6px;background:#eaf2ff}
.post{background:white;border:1px solid #eee;border-radius:12px;margin-top:20px;overflow:hidden}
.posthead{display:flex;align-items:center;gap:10px;padding:13px;font-weight:bold}
.avatar{width:35px;height:35px;border-radius:50%;background:#dceaff;display:grid;place-items:center}
.photo{height:330px;background:linear-gradient(135deg,#dbeafe,#93c5fd,#e0e7ff);display:grid;place-items:center;font-size:38px;color:#1856a5;font-weight:bold}
.actions{padding:12px;font-size:23px}
.actions button{border:0;background:none;font-size:23px;cursor:pointer}
.caption{padding:0 14px 15px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px}
nav button{border:0;background:none;font-size:22px;cursor:pointer}
.page{display:none}.page.active{display:block}
.profile{text-align:center;background:white;padding:25px;border-radius:12px}
.bigavatar{width:90px;height:90px;border-radius:50%;background:#dceaff;display:grid;place-items:center;font-size:40px;margin:auto}
.stats{display:flex;justify-content:center;gap:28px;margin:20px}
.stats b{display:block;font-size:19px}
.actionbtn{background:#1877f2;color:white;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
@media(min-width:700px){nav{max-width:650px;left:50%;transform:translateX(-50%);border:1px solid #ddd;border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<header>
<div class="logo">ZM SOCIAL</div>
<input placeholder="Search">
<div>♡　✉</div>
</header>
<main>
<section id="home" class="page active">
<div class="stories">
<div class="story"><div class="circle">＋</div>Your story</div>
<div class="story"><div class="circle">😊</div>Friend 1</div>
<div class="story"><div class="circle">🌸</div>Friend 2</div>
<div class="story"><div class="circle">✨</div>Friend 3</div>
<div class="story"><div class="circle">🌙</div>Friend 4</div>
</div>
<div id="feed">
<article class="post">
<div class="posthead"><div class="avatar">M</div> masum_zehen</div>
<div class="photo">ZM SOCIAL</div>
<div class="actions">
<button onclick="like(this)">♡</button>
<button>♡</button>
<button>➤</button>
</div>
<div class="caption"><b>masum_zehen</b> Welcome to ZM SOCIAL! ✨</div>
</article>
</div>
</section>
<section id="explore" class="page"><h2>Explore</h2><p>Discover people and posts on ZM SOCIAL.</p></section>
<section id="reels" class="page"><h2>Reels</h2><p>Short videos will appear here.</p></section>
<section id="create" class="page"><h2>Create Post</h2><input type="file" accept="image/*,video/*"><p><textarea placeholder="Write a caption..." rows="4"></textarea></p><button class="actionbtn" onclick="alert('Post feature needs database setup')">Share</button></section>
<section id="profile" class="page">
<div class="profile">
<div class="bigavatar">M</div>
<h2>Masum Zehen</h2><p>@masum_zehen</p>
<div class="stats">
<div><b>1</b>Posts</div>
<div><b>0</b>Followers</div>
<div><b>0</b>Following</div>
</div>
<button class="actionbtn">Edit Profile</button>
</div>
<h3>Posts</h3>
</section>
</main>
<nav>
<button onclick="showPage('home')">⌂</button>
<button onclick="showPage('explore')">⌕</button>
<button onclick="showPage('create')">＋</button>
<button onclick="showPage('reels')">▣</button>
<button onclick="showPage('profile')">◉</button>
</nav>
<script>
function showPage(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
function like(btn){
btn.textContent=btn.textContent==='♡'?'♥':'♡';
btn.style.color=btn.textContent==='♥'?'#1877f2':'black';
}
</script>
</body>
</html>
